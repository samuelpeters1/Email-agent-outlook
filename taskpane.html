<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resident Email Manager</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafaf8;
            color: #2c2c2a;
        }

        .container {
            padding: 16px;
            height: 100vh;
            overflow-y: auto;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #2c2c2a;
        }

        .email-info {
            background: white;
            border: 1px solid #e0dfd8;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .info-label {
            color: #5f5e5a;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-value {
            color: #2c2c2a;
            font-weight: 500;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #e0dfd8;
            border-top: 2px solid #185fa5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .analysis-section {
            background: white;
            border: 1px solid #e0dfd8;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .cat-maintenance { background: #e6f1fb; color: #185fa5; }
        .cat-billing { background: #fcebeb; color: #e24b4a; }
        .cat-amenities { background: #eaf3de; color: #639922; }
        .cat-complaint { background: #faeeda; color: #ba7517; }
        .cat-general { background: #f1efe8; color: #444441; }

        .response-text {
            background: #e6f1fb;
            border: 1px solid #85b7eb;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        button {
            background: #185fa5;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: background 0.2s;
        }

        button:hover {
            background: #0c447c;
        }

        button:disabled {
            background: #d3d1c7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: white;
            color: #185fa5;
            border: 1px solid #e0dfd8;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #f1efe8;
        }

        .error {
            background: #fcebeb;
            border: 1px solid #f0997b;
            color: #e24b4a;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .success {
            background: #eaf3de;
            border: 1px solid #97c459;
            color: #3b6d11;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .urgency {
            font-size: 12px;
            color: #5f5e5a;
            margin-top: 8px;
        }

        .empty-state {
            background: #f1efe8;
            border-radius: 6px;
            padding: 24px 16px;
            text-align: center;
            color: #5f5e5a;
            font-size: 13px;
        }

        .section-title {
            font-size: 12px;
            color: #5f5e5a;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📧 Email Manager</h2>
        
        <div id="apiKeyPrompt">
            <div style="background: #e6f1fb; border: 1px solid #85b7eb; border-radius: 6px; padding: 12px; margin-bottom: 12px;">
                <div style="font-weight: 600; color: #185fa5; margin-bottom: 8px;">⚙️ Setup Required</div>
                <div style="font-size: 12px; color: #185fa5; line-height: 1.5;">
                    1. Get your key from <strong>console.anthropic.com → API Keys</strong><br>
                    2. Paste it below (looks like: sk-ant-v0-...)<br>
                    3. Click Save
                </div>
            </div>
            <label style="font-size: 13px; color: #2c2c2a; display: block; margin-bottom: 6px; font-weight: 600;">
                Claude API Key:
            </label>
            <input type="password" id="apiKey" placeholder="sk-ant-v0-..." style="width: 100%; padding: 10px; border: 1px solid #e0dfd8; border-radius: 6px; font-size: 12px; margin-bottom: 8px; font-family: monospace;">
            <button onclick="saveApiKey()" style="margin-top: 0;">✓ Save API Key</button>
            <button onclick="toggleShowKey()" class="btn-secondary" style="margin-top: 6px;">Show Key</button>
        </div>

        <div id="emailContent"></div>

        <div id="analysisArea" style="display: none;">
            <h2>Analysis</h2>
            <div id="analysisResult"></div>
        </div>
    </div>

    <script>
        const API_KEY_STORAGE = 'outlookAddInApiKey';
        let currentEmail = null;
        let allRequests = [];

        Office.onReady(() => {
            console.log('Office Add-in ready');
            loadApiKey();
            loadRequests();
            getSelectedEmail();
        });

        function loadApiKey() {
            const savedKey = localStorage.getItem(API_KEY_STORAGE);
            if (savedKey) {
                document.getElementById('apiKeyPrompt').style.display = 'none';
            } else {
                document.getElementById('apiKeyPrompt').style.display = 'block';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) {
                alert('Please enter an API key');
                return;
            }
            if (!key.startsWith('sk-')) {
                alert('Invalid key format. Keys start with "sk-"');
                return;
            }
            localStorage.setItem(API_KEY_STORAGE, key);
            document.getElementById('apiKeyPrompt').style.display = 'none';
            document.getElementById('apiKey').value = '';
            getSelectedEmail();
        }

        function toggleShowKey() {
            const input = document.getElementById('apiKey');
            if (input.type === 'password') {
                input.type = 'text';
                event.target.textContent = 'Hide Key';
            } else {
                input.type = 'password';
                event.target.textContent = 'Show Key';
            }
        }

        function changeApiKey() {
            localStorage.removeItem(API_KEY_STORAGE);
            document.getElementById('apiKeyPrompt').style.display = 'block';
            document.getElementById('apiKey').value = '';
            document.getElementById('apiKey').focus();
        }

        function getSelectedEmail() {
            const apiKey = localStorage.getItem(API_KEY_STORAGE);
            if (!apiKey) return;

            Office.context.mailbox.item.getAsync('text', async (result) => {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    const itemId = Office.context.mailbox.item.itemId;
                    const sender = Office.context.mailbox.item.from.emailAddress;
                    const subject = Office.context.mailbox.item.subject;
                    const body = result.value;

                    // Extract name from sender
                    let senderName = sender.split('@')[0];
                    if (Office.context.mailbox.item.from.displayName) {
                        senderName = Office.context.mailbox.item.from.displayName;
                    }

                    currentEmail = {
                        itemId,
                        sender: senderName,
                        subject,
                        body
                    };

                    displayEmailInfo();
                    analyzeEmail();
                }
            });
        }

        function displayEmailInfo() {
            const html = `
                <div class="email-info">
                    <div class="info-label">From:</div>
                    <div class="info-value">${escapeHtml(currentEmail.sender)}</div>
                    <div class="info-label">Subject:</div>
                    <div class="info-value">${escapeHtml(currentEmail.subject)}</div>
                    <button onclick="getSelectedEmail()">🔄 Refresh Email</button>
                    <button class="btn-secondary" onclick="changeApiKey()" style="margin-top: 6px;">⚙️ Change API Key</button>
                </div>
            `;
            document.getElementById('emailContent').innerHTML = html;
        }

        async function analyzeEmail() {
            if (!currentEmail) return;

            const apiKey = localStorage.getItem(API_KEY_STORAGE);
            if (!apiKey) return;

            const analysisArea = document.getElementById('analysisArea');
            const analysisResult = document.getElementById('analysisResult');

            analysisArea.style.display = 'block';
            analysisResult.innerHTML = '<div style="text-align: center;"><span class="loading"></span> Analyzing...</div>';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-1',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `You are a building property manager. Analyze this resident email and provide:
1. CATEGORY (one of: maintenance, billing, amenities, complaint, general)
2. URGENCY (low, medium, high)
3. A professional but friendly response email

Resident: ${currentEmail.sender}
Subject: ${currentEmail.subject}
Email: "${currentEmail.body}"

Format your response as:
CATEGORY: [category]
URGENCY: [urgency]
RESPONSE:
[response email]`
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const responseText = data.content[0].text;

                const categoryMatch = responseText.match(/CATEGORY:\s*(\w+)/i);
                const urgencyMatch = responseText.match(/URGENCY:\s*(\w+)/i);
                const responseMatch = responseText.match(/RESPONSE:\s*([\s\S]+)$/i);

                const analysis = {
                    category: categoryMatch ? categoryMatch[1].toLowerCase() : 'general',
                    urgency: urgencyMatch ? urgencyMatch[1].toLowerCase() : 'medium',
                    response: responseMatch ? responseMatch[1].trim() : responseText
                };

                displayAnalysis(analysis);
            } catch (error) {
                analysisResult.innerHTML = `<div class="error">Error: ${escapeHtml(error.message)}</div>`;
            }
        }

        function displayAnalysis(analysis) {
            const html = `
                <div class="analysis-section">
                    <div class="category-badge cat-${analysis.category}">${analysis.category}</div>
                    <div class="urgency">
                        <strong>Urgency:</strong> ${analysis.urgency}
                    </div>
                </div>

                <div class="section-title">Suggested Response:</div>
                <div class="response-text">${escapeHtml(analysis.response)}</div>

                <button onclick="copyResponse(\`${escapeHtmlForJs(analysis.response)}\`)">
                    📋 Copy Response
                </button>
                <button class="btn-secondary" onclick="saveRequest(\`${analysis.category}\`, \`${analysis.urgency}\`, \`${escapeHtmlForJs(analysis.response)}\`)">
                    ✓ Save & Log
                </button>
            `;
            document.getElementById('analysisArea').innerHTML = html;
        }

        function copyResponse(text) {
            // Create a temporary element to hold the text
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            // Show confirmation
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }

        function saveRequest(category, urgency, response) {
            const request = {
                id: Date.now(),
                resident: currentEmail.sender,
                category,
                urgency,
                email: currentEmail.body,
                response,
                subject: currentEmail.subject,
                status: 'new',
                date: new Date().toISOString()
            };

            allRequests.push(request);
            saveRequests();

            // Show confirmation
            const html = `<div class="success">✓ Request saved and logged!</div>`;
            const analysisArea = document.getElementById('analysisArea');
            analysisArea.insertAdjacentHTML('afterbegin', html);
        }

        function loadRequests() {
            const stored = localStorage.getItem('emailRequests');
            allRequests = stored ? JSON.parse(stored) : [];
        }

        function saveRequests() {
            localStorage.setItem('emailRequests', JSON.stringify(allRequests));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeHtmlForJs(text) {
            return text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }
    </script>
</body>
</html>
